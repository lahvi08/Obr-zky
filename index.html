<h1>AC/BC</h1>
<p>Jeaustralská rocková hudební skupina, kterou v roce 1973 v Sydney založili bratři Angus Young a Malcolm Young. Skupina je spolu s Led Zeppelin, Deep Purple nebo Black Sabbath považována za průkopníky hard rocku a heavy metalu. Členové však styl skupiny označují jako rock and roll.
